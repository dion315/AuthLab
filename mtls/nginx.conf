# TLS terminator for local certificate-based authentication testing.
#
# The app never sees the TLS handshake — on every platform it deploys to,
# something terminates TLS in front of it — so testing client certificates
# locally needs a terminator here too. This is that, and nothing more.
#
# `optional_no_ca` is the important line: nginx asks the browser for a
# certificate but does not verify it, and hands whatever arrives to the app,
# which runs the checks itself and shows every one of them. Verifying here
# instead would mean a rejected certificate never reaches the app and the
# failure is an nginx error page rather than a test result.
#
# With no `ssl_client_certificate` the CA list sent to the browser is empty, so
# browsers offer every client certificate they hold rather than filtering to
# one issuer — which is what you want when the point is to try several.

events {}

http {
  # Docker's embedded DNS, so a restart of the app container does not leave
  # nginx holding a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    ssl_verify_client optional_no_ca;

    # Certificates are large; the default header buffer is not.
    proxy_buffer_size   16k;
    proxy_buffers       8 16k;
    large_client_header_buffers 4 32k;

    location / {
      set $upstream http://app-mtls:8000;
      proxy_pass $upstream;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # The client certificate, percent-encoded PEM. proxy_set_header replaces
      # any header of this name that arrived from outside, which is what stops
      # a caller simply asserting a certificate it does not hold. A proxy that
      # merely *adds* to inbound headers would make certificate authentication
      # worthless.
      proxy_set_header X-Client-Cert     $ssl_client_escaped_cert;
      proxy_set_header X-Client-Verify   $ssl_client_verify;
    }
  }
}
