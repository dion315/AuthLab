# Local development.
#
# `docker compose up --build` needs nothing else: the app defaults to SQLite in
# a named volume, so there is no database service to wait for and no connection
# string to get right.
#
# To rehearse the deployed setup against Postgres instead:
#   docker compose --profile postgres up --build
#
# To test certificate-based authentication, which needs a TLS terminator that
# asks the browser for a client certificate:
#   docker compose up nginx-mtls --build      -> https://localhost:8443
#
# That last one names the service rather than the profile on purpose: it starts
# the mTLS stack and nothing else, so the plain-HTTP app on 8000 stays out of
# the way. It is a separate instance with its own database.

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Generated once and reused; without this, sessions die on every restart
      # and stored IdP secrets become unreadable.
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-not-a-real-secret-change-me-please}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/authlab.db}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@authlab.local}
      # Leave unset and a random password is generated and printed once to the
      # container log on first start.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - authlab-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Optional. Only starts with `--profile postgres`.
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authlab
      POSTGRES_PASSWORD: authlab
      POSTGRES_DB: authlab
    ports:
      - "5432:5432"
    volumes:
      - authlab-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this before starting, so a cold `compose up` does not
      # race the database's first-boot initialisation.
      test: ["CMD-SHELL", "pg_isready -U authlab -d authlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-postgres:
    profiles: ["postgres"]
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-not-a-real-secret-change-me-please}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      DATABASE_URL: postgresql+psycopg://authlab:authlab@postgres:5432/authlab
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@authlab.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- certificate-based authentication ---------------------------------------
  # Only starts when asked for by name: `docker compose up nginx-mtls`.

  app-mtls:
    profiles: ["mtls"]
    build: .
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-not-a-real-secret-change-me-please}
      # Must match what the browser sees, or the session cookie loses its
      # Secure flag and every derived URL points at the wrong place.
      BASE_URL: https://localhost:8443
      DATABASE_URL: sqlite:///./data/authlab.db
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@authlab.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # nginx is the only thing that can reach this container, so the forwarded
      # client address can be believed.
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - authlab-mtls-data:/app/data
    restart: unless-stopped

  nginx-mtls:
    profiles: ["mtls"]
    image: nginx:1.27-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./mtls/nginx.conf:/etc/nginx/nginx.conf:ro
      - authlab-mtls-certs:/etc/nginx/certs
    depends_on:
      - app-mtls
    # A self-signed server certificate is generated on first start. Browsers
    # will warn about it — that warning is about *this* certificate, not the
    # client certificate being tested, so accept it and continue.
    # One line per shell statement: a YAML folded block keeps the newline on any
    # line indented further than the block, which would split a wrapped command
    # into several broken ones.
    command: >
      sh -c "apk add --no-cache openssl >/dev/null 2>&1 &&
      { [ -f /etc/nginx/certs/server.crt ] || openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout /etc/nginx/certs/server.key -out /etc/nginx/certs/server.crt 2>/dev/null; } &&
      exec nginx -g 'daemon off;'"
    restart: unless-stopped

volumes:
  authlab-data:
  authlab-pgdata:
  authlab-mtls-data:
  authlab-mtls-certs:
